name: CI

on:
  push:

permissions:
  contents: read

jobs:
  quality:
    name: Format, lint, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Generates the route types that `tsc` needs, such as LayoutProps.
      - run: npx next typegen
      - run: npm run check

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - name: Add coverage to the run summary
        if: always() && hashFiles('coverage/coverage-summary.json') != ''
        run: |
          node -e '
            const { total } = require("./coverage/coverage-summary.json");
            console.log("### Unit test coverage\n\n| Metric | Covered |\n| --- | --- |");
            for (const metric of ["statements", "branches", "functions", "lines"]) {
              console.log(`| ${metric} | ${total[metric].pct}% |`);
            }
          ' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
