# The tunnel points here rather than at n8n, so the public URL can only reach
# production webhooks. The editor, API, and test webhooks stay private.
server {
  listen 8080;
  client_max_body_size 64k;

  location /webhook/ {
    proxy_pass http://n8n:5678;
    proxy_set_header Host $host;
  }

  location / {
    return 404;
  }
}
